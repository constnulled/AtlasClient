name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew build

      - name: Find release JAR
        id: find_jar
        run: |
          echo "🔍 Contents of build/libs/:"
          ls -la build/libs/ || echo "Directory empty or missing"

          JAR_FILE=""
          for file in build/libs/AtlasClient-*.jar; do
            [ ! -f "$file" ] && continue
            if [[ "$file" == *-dev.jar || "$file" == *-sources.jar ]]; then
              echo "⏩ Skipping: $file"
              continue
            fi
            echo "✅ Found candidate: $file"
            JAR_FILE="$file"
            break
          done

          if [ -z "$JAR_FILE" ]; then
            echo "❌ ERROR: No valid AtlasClient-*.jar found (excluding -dev and -sources)!"
            exit 1
          fi

          JAR_NAME=$(basename "$JAR_FILE")
          # ✅ FIXED TYPO: AtlasClient (not AtlasCLient)
          VERSION_HASH="${JAR_NAME#AtlasClient-}"
          VERSION_HASH="${VERSION_HASH%.jar}"

          if [ -z "$VERSION_HASH" ] || [ "$VERSION_HASH" = "$JAR_NAME" ]; then
            echo "❌ ERROR: Couldn't parse version/hash from JAR name: $JAR_NAME"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_ENV
          echo "VERSION_HASH=$VERSION_HASH" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.JAR_FILE }}
          tag_name: v${{ github.run_number }}
          name: "AtlasClient Build ${{ github.run_number }}"
          body: |
            Automated CI build of AtlasClient
            Commit: ${{ github.sha }}
            JAR: ${{ env.JAR_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
